# Shared repository policy and tooling; release credentials are referenced by name only.
- repo:
    url: https://github.com/common-repo/semantic-release
    ref: v0.12.2
- repo:
    url: https://github.com/common-repo/mise
    ref: v0.1.0
- repo:
    url: https://github.com/common-repo/renovate
    ref: v0.2.2
- template-vars:
    GH_APP_ID_SECRET: BOT_CLIENT_ID
    GH_APP_KEY_SECRET: BOT_PRIVATE_KEY
    GH_APP_OWNER: shakefu
    COMMON_REPO_VERSION: v0.38.4
- yaml:
    source: .common-repo/mise-action.yaml
    dest: .github/workflows/ci.yaml
    path: jobs.test.steps
    array_mode: merge_by_key
    position: start
- yaml:
    source: .common-repo/large-spec-precommit.yaml
    dest: .pre-commit-config.yaml
    path: repos
    array_mode: merge_by_key
    key: repo
- yaml:
    source: .common-repo/conventional-commits-steps.yaml
    dest: .github/workflows/conventional-commits.yaml
    path: jobs.commits.steps
    array_mode: replace
- json:
    source: .common-repo/renovate-global.json
    dest: .github/renovate-global.json
    array_mode: append_unique
- yaml:
    source: .common-repo/renovate-workflow.yaml
    dest: .github/workflows/renovate.yaml
    path: on.schedule
    array_mode: replace
- yaml:
    source: .common-repo/renovate-workflow-env.yaml
    dest: .github/workflows/renovate.yaml
    path: jobs.renovate.env
- yaml:
    source: .common-repo/renovate-openapi-workflow.yaml
    dest: .github/workflows/renovate.yaml
    path: jobs.renovate.steps
    array_mode: merge_by_key
    key: id
- template:
    - .github/workflows/renovate.yaml
