---
design: RepositoryToolchain
type: constraint
content: |
  Keep Go version 1.26.11 in `.go-version` and `mise.toml`.
  Pin `common-repo` 0.38.4, `prek` 0.5.10, `cocogitto` 7.0.0, and `yass` 0.14.0 in `mise.toml` and commit `mise.lock`.
  Pin common-repo semantic-release v0.12.2 and mise v0.1.0 in `.common-repo.yaml`, following toxin's managed-file conventions.
  Require conventional commits and semantic version releases from the default branch through common-repo.
  Keep the source module installable with `go install github.com/shakefu/go-devin-client/cmd/devin-client@latest`; binary archives and checksums are not required for the initial release.
  Document maintainer bootstrap prerequisites `BOT_CLIENT_ID` and `BOT_PRIVATE_KEY` by name without embedding values or adding private module dependencies.
---
design: GenerationWorkflow
type: procedure
content: |
  Keep root `v3-openapi.yaml` byte-identical to the published Devin v3 source; update it only through explicit `script/update-spec <source>` invocation.
  Run pinned okapi-gen-typed v0.4.0 through `script/generate` using a deterministic, versioned normalized input derived from the vendored source.
  Apply a deterministic, tested generation adaptation that keeps the generated `NewClient` signature while configuring its default HTTP client not to follow redirects.
  Apply a deterministic, tested generation adaptation so generated API error text never exposes response-body data that may contain the configured API key; preserve the complete raw body on `APIError.Body`.
  Document and test each compatibility adaptation; nullable scalar and object values retain absent, null, and value distinctions wherever the source makes those distinctions.
  Represent non-singleton unions without dropping JSON data, using `json.RawMessage` or a round-trip-equivalent `any` representation.
  Generate complete methods for supported operations and provide complete handwritten methods for the three multipart operations and `handle_get_self_v3_self_get`.
  Never discard an operation or a request body; generated methods plus handwritten methods cover each vendored operationId exactly once.
  Keep `client.gen.go` and `types.gen.go` reproducible and never edit generated files by hand; `script/check-generated` fails when fresh output differs.
---
design: CLICommandGeneration
type: procedure
content: |
  Build the API command metadata and operation leaf actions with the public okapi v0.4.0 CLI and spec APIs.
  Keep a deterministic CLI-only projection with every operation method, path, parameter, request-body media type, and required bit; leave domain request validation to the Devin API.
  Route CLI requests through the authenticated HTTP client created by `New` so the SDK origin and redirect policy also govern CLI calls.
  Flatten okapi's underscore-delimited command tree into top-level leaves and reconstruct each exact operationId from its tree segments.
  Adapt generated leaf actions as needed for timeout, shared transport, safety, and output contracts while preserving generated flags and operation semantics.
  Keep the original operationIds unchanged and verify a one-to-one mapping between the 284 source operations and CLI operation commands.
  Adapt multipart commands to stream the file part and apply the shared CLI safety and output contract without copying go-tcr-client private API contracts.
  Fail generation when an operationId collides with `ops`, `help`, or `version`, or when an operation parameter collides with a global CLI flag.
---
design: TestWorkflow
type: procedure
content: |
  Run `yass validate`, `yass lint`, `script/check-generated`, `go vet ./...`, and `go test ./...` through `script/test` and CI.
  Exercise SDK and CLI HTTP behavior only against local `httptest` servers and subprocess fixtures; no test uses a paid or live Devin API.
  Cover successful, empty, error, timeout, cancellation, malformed input, nullable and union JSON, uploads, redirects, credential redaction, dry-run, read-only rejection, and all operation mappings.
